<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
</head>
<body style="
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 10% 20%, #4facfe 0%, #00f2fe 90%);
    color: #2d3748;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    box-sizing: border-box;
">
    <div style="
        position: relative;
        background: rgba(255, 255, 255, 0.82);
        padding: 40px;
        border-radius: 28px;
        box-shadow:
            0 25px 50px -12px rgba(0, 0, 0, 0.15),
            0 0 0 1px rgba(255, 255, 255, 0.8) inset;
        max-width: 420px;
        width: 100%;
        box-sizing: border-box;
        overflow: hidden;
    ">

        <img src="immagine.jpg" alt="Immagine" style="
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
        ">

        <h1 style="
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 2.5em;
            font-weight: 800;
            letter-spacing: -1px;
        ">
        </h1>

        <p style="
            color: #64748b;
            font-size: 1.05em;
            line-height: 1.5;
            margin-top: 0;
            margin-bottom: 28px;
        ">
        </p>
        <h2 style="
            color: #0f172a;
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
        ">
        </h2>
            <ul style="
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        ">

            <li style="
                background: rgba(255, 255, 255, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.8);
                border-radius: 14px;
                padding: 14px 18px;
                font-weight: 600;
                color: #0f172a;
                display: flex;
                align-items: center;
            ">
                <a href="#" style="
                    color: #0f172a;
                    text-decoration: none;
                    width: 100%;
                    display: block;
                ">
                </a>
            </li>

            <li style="
                background: rgba(255, 255, 255, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.8);
                border-radius: 14px;
                padding: 14px 18px;
                font-weight: 600;
                color: #0f172a;
                display: flex;
                align-items: center;
            ">
                <a href="#" style="
                    color: #0f172a;
                    text-decoration: none;
                    width: 100%;
                    display: block;
                ">
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
