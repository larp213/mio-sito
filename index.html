<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <title>La pagina del secolo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #d0e8d0);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .container {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 0.8s ease-out forwards;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
  </style>
</head>  
<body>
  <div class="card">
    <h1>Ciaoo!</h1>
    <p>Questa è la mia prima pagina HTML.</p>

    <h2>I miei hobby</h2>
    <ul>
      <li>Motori</li>
      <li>VideoGiochi</li>
      <li>Musica</li>
    </ul>
  </div>
</body>
</html>
